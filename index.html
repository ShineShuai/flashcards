<!DOCTYPE html>
<html data-theme="light" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
// Saved or system theme before first paint (no light flash in dark mode)
(function () {
  var theme = null;
  try {
    theme = localStorage.getItem('fc-theme');
  } catch (e) {
    theme = null;
  }
  if (!theme) {
    var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    theme = dark ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<title>⚡ Flash</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<!-- pinned + integrity-checked; marked 18 ships lib/marked.umd.js (no root marked.min.js) -->
<script src="https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.umd.js"
  integrity="sha384-rATToyt6602Jnq8c7w8HZwmyOUgPL7mzxX01FBWoV48ns/EgkakGozpES+PnaYOI"
  crossorigin="anonymous"></script>
<style>
:root {
  --pink:    #FF2D87;
  --purple:  #7C3AFF;
  --mint:    #00D68F;
  --amber:   #FFB800;
  --blue:    #00B4FF;
  --red:     #FF3B30;
  --bg:        #F5F0FF;
  --bg2:       #EDE8FF;
  --surface:   #FFFFFF;
  --surface2:  #F8F5FF;
  --text:      #14142B;
  --text2:     #5E5B87;
  --border:    rgba(124,58,255,0.15);
  --shadow:    0 8px 40px rgba(124,58,255,0.14);
  --shadow-sm: 0 2px 12px rgba(124,58,255,0.10);
  --radius:    20px;
  /* text-safe accents (>= 4.5:1 on white and on --bg2) */
  --mint-t:    #00704D;
  --blue-t:    #006EA8;
  --amber-t:   #8A5F00;
  --pink-t:    #C8105A;
  --purple-t:  #7C3AFF;
  --on-bright: #14142B;
}
[data-theme="dark"] {
  --bg:       #07071A;
  --bg2:      #0D0D28;
  --surface:  #10102E;
  --surface2: #18183C;
  --text:     #EEEAFF;
  --text2:    #8886AA;
  --border:   rgba(124,58,255,0.28);
  --shadow:   0 8px 40px rgba(124,58,255,0.30);
  --shadow-sm:0 2px 12px rgba(124,58,255,0.20);
  --mint-t:   var(--mint);
  --blue-t:   var(--blue);
  --amber-t:  var(--amber);
  --pink-t:   var(--pink);
  --purple-t: #9C7BFF;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans', 'Noto Sans JP', 'Noto Sans KR', 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  transition: background .3s, color .3s;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 55% 55% at 15% 15%, rgba(124,58,255,.09) 0%, transparent 65%),
    radial-gradient(ellipse 50% 50% at 85% 85%, rgba(255,45,135,.08) 0%, transparent 65%),
    radial-gradient(ellipse 40% 40% at 70% 10%, rgba(0,214,143,.06) 0%, transparent 65%),
    radial-gradient(ellipse 35% 35% at 20% 85%, rgba(0,180,255,.05) 0%, transparent 65%);
  pointer-events: none;
  z-index: 0;
  transition: opacity .4s;
}
[data-theme="dark"] body::before {
  background:
    radial-gradient(ellipse 55% 55% at 15% 15%, rgba(124,58,255,.18) 0%, transparent 65%),
    radial-gradient(ellipse 50% 50% at 85% 85%, rgba(255,45,135,.14) 0%, transparent 65%),
    radial-gradient(ellipse 40% 40% at 70% 10%, rgba(0,214,143,.10) 0%, transparent 65%),
    radial-gradient(ellipse 35% 35% at 20% 85%, rgba(0,180,255,.08) 0%, transparent 65%);
}
.top-bar {
  position: fixed; top: 0; left: 0; right: 0; height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 200;
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  background: rgba(255,255,255,0.75);
  border-bottom: 1px solid var(--border);
  transition: background .3s, border .3s;
}
[data-theme="dark"] .top-bar { background: rgba(16,16,46,0.85); }
.logo {
  font-weight: 900; font-size: 1.15rem; letter-spacing: -.01em;
  background: linear-gradient(135deg, var(--purple) 0%, var(--pink) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.top-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface2);
  cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: transform .2s, background .3s;
}
.icon-btn:hover { background: var(--bg2); }
@media (hover: hover) {
  .icon-btn:hover { transform: scale(1.1) rotate(12deg); }
}
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.screen {
  position: relative; z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 68px 16px calc(32px + env(safe-area-inset-bottom, 0px));
}
.hidden { display: none !important; }
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 28px 24px;
  width: 100%; max-width: 580px;
  transition: background .3s, border .3s, box-shadow .3s;
}
.stats-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 12px; margin-bottom: 24px;
}
.stat-box {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px 12px; text-align: center;
  transition: background .3s;
}
.stat-num {
  font-size: 2rem; font-weight: 900; line-height: 1; margin-bottom: 4px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-num.mint  { background: linear-gradient(135deg, var(--mint-t), var(--blue-t));
                  -webkit-background-clip: text; background-clip: text; }
.stat-num.amber { background: linear-gradient(135deg, var(--amber-t), var(--pink-t));
                  -webkit-background-clip: text; background-clip: text; }
.stat-label { font-size: .68rem; font-weight: 700; text-transform: uppercase;
              letter-spacing: .08em; color: var(--text2); }
.home-title { font-size: 1.3rem; font-weight: 900; margin-bottom: 4px; }
.home-sub   { color: var(--text2); font-size: .85rem; margin-bottom: 20px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 13px 24px; border: none; border-radius: 100px;
  font-family: inherit; font-weight: 700; font-size: .95rem;
  cursor: pointer; white-space: nowrap;
  transition: transform .15s, box-shadow .15s, opacity .15s, background .2s;
}
@media (hover: hover) {
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
}
.btn:active:not(:disabled) { transform: translateY(0) scale(.98); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-block { width: 100%; }
.btn-primary {
  background: linear-gradient(135deg, var(--purple) 0%, #D4145F 100%);
  color: #fff; box-shadow: 0 4px 20px rgba(124,58,255,.40);
}
.btn-secondary { background: var(--bg2); color: var(--text); border: 1px solid var(--border); }
.btn-hint {
  background: transparent; color: var(--purple-t);
  border: 1.5px solid var(--purple-t); padding: 10px 20px; font-size: .88rem;
}
.btn-hint:hover:not(:disabled) { background: rgba(124,58,255,.08); }
.btn-flip {
  background: linear-gradient(135deg, var(--amber) 0%, #FF8C00 100%);
  color: var(--on-bright); box-shadow: 0 4px 16px rgba(255,184,0,.40);
  padding: 10px 20px; font-size: .88rem;
}
.btn-skip {
  background: transparent; color: var(--text2);
  border: 1.5px dashed var(--border); padding: 10px 20px; font-size: .88rem;
}
.btn-skip:hover:not(:disabled) { background: rgba(124,58,255,.06); color: var(--text); }
.skip-badge {
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(255,184,0,.18); color: var(--amber-t);
  border-radius: 100px; font-size: .62rem; font-weight: 700;
  padding: 1px 6px; margin-left: 5px; letter-spacing: .04em;
}
.btn-spell {
  background: transparent; color: var(--mint-t);
  border: 1.5px solid var(--mint-t); padding: 10px 20px; font-size: .88rem;
}
.btn-spell:hover:not(:disabled) { background: rgba(0,214,143,.08); }
.rating-grid {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 8px; margin-top: 18px;
}
.btn-rate {
  padding: 11px 6px; font-size: .8rem; font-weight: 700; min-height: 48px;
  border-radius: 12px; color: #fff; border: none;
  cursor: pointer; font-family: inherit;
  transition: transform .15s, box-shadow .15s, outline .1s;
  position: relative;
}
@media (hover: hover) {
  .btn-rate:hover { transform: translateY(-2px) scale(1.03); }
}
.btn-rate:active { transform: scale(.97); }
.btn-rate .interval-badge {
  display: block; font-size: .75rem; font-weight: 400; margin-top: 2px;
}
.btn-again { background: #D4145F; box-shadow: 0 3px 14px rgba(212,20,95,.40); }
.btn-recap {
  background: #FFB000; color: var(--on-bright);
  box-shadow: 0 3px 14px rgba(255,176,0,.40);
}
.btn-hard  {
  background: #FF7A00; color: var(--on-bright);
  box-shadow: 0 3px 14px rgba(255,122,0,.40);
}
.btn-good  { background: #7C3AFF; box-shadow: 0 3px 14px rgba(124,58,255,.40); }
.btn-easy  {
  background: #00A870; color: var(--on-bright);
  box-shadow: 0 3px 14px rgba(0,168,112,.40);
}
.btn-rate.suggested {
  outline: 3px solid var(--text);
  outline-offset: 2px; transform: scale(1.06);
}
.rating-hint { text-align: center; font-size: .7rem; color: var(--text2); margin-top: 8px; }
.progress-wrap { width: 100%; max-width: 860px; margin-bottom: 14px; }
.progress-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-size: .72rem; color: var(--text2); margin-bottom: 5px; font-weight: 600;
}
.progress-track { height: 5px; background: var(--bg2); border-radius: 100px; overflow: hidden; }
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--purple) 0%, var(--pink) 100%);
  border-radius: 100px; transition: width .45s cubic-bezier(.4,0,.2,1);
}
.card-scene { width: 100%; max-width: 860px; perspective: 1200px; margin-bottom: 14px; }
.card-3d {
  width: 100%; min-height: clamp(420px, 62vh, 780px);
  min-height: clamp(420px, 62dvh, 780px);
  position: relative; transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.4,0,.2,1);
}
.card-3d.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute; inset: 0;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 24px 22px; overflow-y: auto;
  min-height: clamp(420px, 62vh, 780px);
  min-height: clamp(420px, 62dvh, 780px);
  display: flex; flex-direction: column; transition: background .3s;
}
.card-face-back { transform: rotateY(180deg); }
.card-meta {
  font-size: .68rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .09em; color: var(--text2); margin-bottom: 14px;
  display: flex; align-items: center; justify-content: space-between;
}
.card-meta-tag {
  background: linear-gradient(135deg, var(--purple), var(--pink));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
/* ── Title ── */
.card-title {
  font-size: 1.35rem; font-weight: 900; color: var(--text);
  text-align: center; padding: 18px 0 10px;
  letter-spacing: -.01em; line-height: 1.3;
}
.keywords-area {
  flex: 1; display: flex; flex-wrap: wrap;
  gap: 10px; align-content: flex-start; min-height: 80px;
}
.kw-pill {
  padding: 7px 16px; border-radius: 100px;
  font-weight: 700; font-size: .95rem;
  animation: popIn .28s cubic-bezier(.34,1.56,.64,1) both;
}
.kw-pill.ghost {
  background: var(--bg2) !important; color: transparent !important;
  border: 1.5px dashed var(--border); animation: none; user-select: none;
}
/* ── Spell slot: ghost pill becomes an inline input ── */
.kw-pill.spell-slot {
  background: var(--bg2) !important;
  border: 1.5px dashed var(--purple);
  color: var(--text); -webkit-text-fill-color: var(--text);
  font-weight: 700; font-size: 1rem; font-family: inherit;
  outline: none; min-width: 80px; width: auto;
  padding: 7px 16px; border-radius: 100px; animation: none;
  transition: border-color .15s, background .15s;
}
.kw-pill.spell-slot::placeholder { color: var(--text2); opacity: .5; font-weight: 400; }
.kw-pill.spell-slot:focus { border-color: var(--pink); border-style: solid; }
.kw-pill.spell-slot.correct {
  border-color: var(--mint); border-style: solid;
  background: rgba(0,214,143,.08) !important;
  color: var(--mint-t); -webkit-text-fill-color: var(--mint-t);
}
.kw-pill.spell-slot.wrong {
  border-color: var(--pink); border-style: solid;
  background: rgba(255,45,135,.08) !important;
}
[data-theme="dark"] .kw-pill.spell-slot.correct {
  color: var(--mint); -webkit-text-fill-color: var(--mint);
}
/* Accent colors for revealed pills */
.kw-pill:nth-child(5n+1) { background:rgba(255,45,135,.12);  color:var(--pink-t); }
.kw-pill:nth-child(5n+2) { background:rgba(124,58,255,.12);  color:var(--purple-t); }
.kw-pill:nth-child(5n+3) { background:rgba(0,214,143,.12);   color:var(--mint-t); }
.kw-pill:nth-child(5n+4) { background:rgba(255,184,0,.12);   color:var(--amber-t); }
.kw-pill:nth-child(5n+5) { background:rgba(0,180,255,.12);   color:var(--blue-t); }
[data-theme="dark"] .kw-pill:nth-child(5n+3) { color:var(--mint); }
[data-theme="dark"] .kw-pill:nth-child(5n+4) { color:var(--amber); }
[data-theme="dark"] .kw-pill:nth-child(5n+5) { color:var(--blue); }
@keyframes popIn {
  from { transform: scale(.4) rotate(-10deg); opacity: 0; }
  to   { transform: scale(1)  rotate(0deg);   opacity: 1; }
}
.front-actions {
  display: flex; gap: 10px; justify-content: center;
  margin-top: 18px; flex-wrap: wrap;
}
/* primary action on its own row, secondary actions share the row below */
.front-actions .btn-flip { order: -1; flex: 1 1 100%; padding: 14px 24px; font-size: 1rem; }
.front-actions .btn:not(.btn-flip) { flex: 1 1 0; min-width: 0; padding: 10px 12px; }
.hint-status { text-align: center; font-size: .7rem; color: var(--text2); margin-top: 8px; }
/* ── Spell result + actions ── */
.spell-result {
  display: none; text-align: center; font-size: .75rem;
  color: var(--text2); margin-top: 6px;
}
.spell-actions {
  display: none; gap: 8px; justify-content: center;
  flex-wrap: wrap; margin-top: 8px;
}
.back-content {
  flex: 1; overflow-y: auto; font-size: .93rem; line-height: 1.75; color: var(--text);
}
.back-content-text { white-space: pre-wrap; }
.back-note { font-size: .75rem; color: var(--text2); margin-bottom: 8px; }
.back-content img  { max-width:100%; border-radius:12px; margin:8px 0; display:block; }
.back-content h1,.back-content h2,.back-content h3
  { margin: .7em 0 .3em; color:var(--text); font-weight:900; }
.back-content h1 { font-size:1.3em; }
.back-content h2 { font-size:1.1em; }
.back-content h3 { font-size:1em; }
.back-content p  { margin-bottom:.7em; }
.back-content ul,.back-content ol { padding-left: 1.4em; margin-bottom:.7em; }
.back-content pre {
  background: var(--bg2); padding: 12px 14px; border-radius: 10px;
  overflow-x: auto; font-size: .82em; margin: .5em 0;
}
.back-content code {
  font-family: monospace; background: var(--bg2);
  padding: 1px 5px; border-radius: 4px; font-size: .85em;
}
.back-content blockquote {
  border-left: 3px solid var(--purple); padding-left: 12px;
  color: var(--text2); margin: .5em 0;
}
.back-content table { border-collapse: collapse; width: 100%; margin: .5em 0; }
.back-content th,.back-content td {
  padding: 6px 10px; border: 1px solid var(--border); font-size: .88em;
}
.back-content th { background: var(--bg2); font-weight: 700; }
.complete-icon  { font-size: 4rem; line-height: 1; margin-bottom: 12px; }
.complete-title { font-size: 2rem; font-weight: 900; margin-bottom: 6px; }
.complete-sub   { color: var(--text2); font-size: .9rem; margin-bottom: 24px; }
.complete-stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; margin-bottom: 24px;
}
.cs-box { background: var(--bg2); border-radius: 12px; padding: 12px 8px; text-align: center; }
.cs-num { font-size: 1.5rem; font-weight: 900; }
.cs-lbl { font-size: .65rem; text-transform: uppercase;
          letter-spacing: .07em; color: var(--text2); margin-top: 2px; }
.spinner {
  width: 44px; height: 44px; border: 4px solid var(--border);
  border-top-color: var(--purple); border-radius: 50%;
  animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.state-badge {
  display: inline-block; padding: 2px 8px; border-radius: 100px;
  font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing:.06em;
}
.badge-new      { background: rgba(0,180,255,.15); color: var(--blue-t); }
.badge-learning { background: rgba(255,184,0,.15);  color: var(--amber-t); }
.badge-review   { background: rgba(124,58,255,.15); color: var(--purple-t); }
.badge-relearn  { background: rgba(255,45,135,.15); color: var(--pink-t); }
.docs-link {
  font-family: inherit; font-size: .75rem; font-weight: 600; color: var(--text2);
  background: none; cursor: pointer;
  text-decoration: none; padding: 6px 12px; border-radius: 100px;
  border: 1px solid var(--border); transition: color .15s, background .15s;
}
.docs-link:hover { color: var(--purple-t); background: rgba(124,58,255,.08); }
/* ── Save status pill (pending / failed saves) ── */
.save-status {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  padding: 6px 14px; border-radius: 100px; z-index: 300; display: none;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
  font-size: .75rem; font-weight: 600; color: var(--text2);
  pointer-events: none;
}
.save-status.error { color: var(--pink); border-color: var(--pink); }
#docs-modal {
  position: fixed; inset: 0; z-index: 500; display: flex; flex-direction: column;
  background: var(--bg);
}
.docs-bar {
  flex: none; height: 52px; padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); font-weight: 700; font-size: .9rem;
}
#docs-content { flex: 1; display: flex; overflow: hidden; }
.docs-loading { margin: auto; color: var(--text2); font-size: .85rem; }
/* ── Undo, keyboard hints ── */
.btn-undo {
  font-family: inherit; font-size: .72rem; font-weight: 700; color: var(--text2);
  background: none; border: none; border-radius: 100px; padding: 2px 8px; cursor: pointer;
}
.btn-undo:hover:not(:disabled) { color: var(--purple-t); background: rgba(124,58,255,.08); }
.btn-undo:disabled { opacity: .4; cursor: default; }
.k {
  font-family: inherit; font-size: .66rem; font-weight: 700; opacity: .75;
  border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 6px;
}
.btn-rate .k {
  position: absolute; top: 3px; left: 4px; margin: 0;
  font-size: .6rem; padding: 0 3px;
}
@media (hover: none) { .k { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
@media (max-width: 640px) {
  /* card fills the screen so the rating row sits in the thumb zone */
  .card-3d, .card-face { min-height: max(380px, calc(100dvh - 176px)); }
}
@media (max-width: 420px) {
  .rating-grid { gap: 6px; }          /* five columns on every phone */
  .stats-grid  { grid-template-columns: repeat(3, 1fr); }
  .panel, .card-face { padding: 18px 14px; }
  .stat-num { font-size: 1.5rem; }
  .btn-rate { padding: 9px 2px; font-size: .72rem; }
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">⚡ Flash</div>
  <div class="top-actions">
    <button class="docs-link" id="docs-link" onclick="openDocs()">📖 Docs</button>

<script>
let _docsBlobUrl = null;

function openDocsNewTab() {
  google.script.run.withSuccessHandler(function(url) {
    window.open(url, '_blank');
  }).getDocsUrl();
}
function openDocs() {
  const modal = document.getElementById('docs-modal');
  modal.classList.remove('hidden');
  document.getElementById('docs-close').focus();
  if (_docsBlobUrl) return; // already loaded for this session
  google.script.run
    .withSuccessHandler(html => {
      const blob = new Blob([html], { type: 'text/html' });
      _docsBlobUrl = URL.createObjectURL(blob);
      const iframe = document.createElement('iframe');
      iframe.title = 'Documentation';
      iframe.src = _docsBlobUrl;
      iframe.style.cssText = 'width:100%;height:100%;border:none;';
      iframe.addEventListener('load', () => {
        const loading = document.getElementById('docs-loading');
        if (loading) loading.remove();
      });
      document.getElementById('docs-content').appendChild(iframe);
    })
    .withFailureHandler(err => {
      document.getElementById('docs-loading').textContent =
        'Could not load the documentation: ' + err.message;
    })
    .getDocsHtml();
}
function closeDocs() {
  document.getElementById('docs-modal').classList.add('hidden');
  document.getElementById('docs-link').focus();
}
window.addEventListener('beforeunload', () => {
  if (_docsBlobUrl) { URL.revokeObjectURL(_docsBlobUrl); _docsBlobUrl = null; }
});

// ═══════════════════════════════════════════════════════════════════════════
// FSRS v5
// Ref: https://github.com/open-spaced-repetition/py-fsrs
// ═══════════════════════════════════════════════════════════════════════════
// @fsrs-begin
// Default parameters (19 values, open-spaced-repetition/py-fsrs v5)
const W = [
  0.40255, 1.18385, 3.17300, 15.69105,   // w[0..3]  S₀ per grade
  7.19490, 0.53450,  1.46040,  0.00460,   // w[4..7]  D₀, difficulty
  1.54575, 0.11920,  1.01925,  1.93950,   // w[8..11] recall stability
  0.11000, 0.29605,  2.26980,  0.23150,   // w[12..15] forget stability + hard penalty
  2.98980, 0.51655,  0.66210              // w[16..18] easy bonus, short-term
];
// Intra-day steps for Learning/Relearning states (in fractional days)
const LEARNING_STEPS = [10 / 1440, 60 / 1440]; // Again→10 min, Hard→1 h
// Interval = days until predicted recall falls to this level. Higher means
// shorter intervals and more reviews. Independent of the curve constants.
const DESIRED_RETENTION = 0.94;
const MAX_INTERVAL = 365;   // days; caps scheduled_days only, not stability
const ROLLOVER_HOUR = 4;    // a new study day starts at 04:00 local time
const DECAY  = -0.5;
const FACTOR = Math.pow(0.9, 1 / DECAY) - 1;   // curve constant: R(t = S) = 0.9

// Repeat-miss decay applied to Recap's interval when the same hint-revealed
// keyword(s) recur across consecutive reviews (exact-text match). Each
// consecutive miss multiplies the Recap interval by this factor.
const REPEAT_MISS_DECAY = 0.7;

function forgettingCurve(t, s) {
  if (!s || s <= 0) return 0;
  return Math.pow(1 + FACTOR * t / s, DECAY);
}
function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
function initS(g) { return Math.max(W[g - 1], 0.1); }
function initD(g) { return clamp(W[4] - Math.exp(W[5] * (g - 1)) + 1, 1, 10); }
function nextD(d, g) {
  // FSRS-5: linear damping, mean reversion towards D0(Easy)
  const delta   = -W[6] * (g - 3);
  const damped  = d + (10 - d) * delta / 9;
  return clamp(W[7] * initD(4) + (1 - W[7]) * damped, 1, 10);
}
function sRecall(d, s, r, g) {
  const hardPenalty = g === 2 ? W[15] : 1;
  const easyBonus   = g === 4 ? W[16] : 1;
  return s * (Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9])
    * (Math.exp(W[10] * (1 - r)) - 1) * hardPenalty * easyBonus + 1);
}
function sForget(d, s, r) {
  const longTerm = W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1)
    * Math.exp(W[14] * (1 - r));
  const cap = s / Math.exp(W[17] * W[18]);   // post-lapse S never exceeds this
  return Math.max(Math.min(longTerm, cap), 0.1);
}
function sShort(s, g) { return Math.max(s * Math.exp(W[17] * (g - 3 + W[18])), 0.1); }
// Study-day index in local time; the day starts at ROLLOVER_HOUR.
function studyDay(date) {
  const shifted = new Date(date.getTime() - ROLLOVER_HOUR * 3600000);
  return Date.UTC(shifted.getFullYear(), shifted.getMonth(), shifted.getDate()) / 86400000;
}
function daysBetween(a, b) {
  return studyDay(b) - studyDay(a);
}
// Intervals >= 1 day snap to ROLLOVER_HOUR of the target study day (Anki-style);
// sub-day steps stay exact timestamps.
function dueDate(now, days) {
  if (days < 1) {
    return new Date(now.getTime() + days * 86400000);
  }
  const shifted = new Date(now.getTime() - ROLLOVER_HOUR * 3600000);
  return new Date(shifted.getFullYear(), shifted.getMonth(),
                  shifted.getDate() + days, ROLLOVER_HOUR, 0, 0, 0);
}
// Stability -> whole-day interval for DESIRED_RETENTION, capped at MAX_INTERVAL.
function intervalDays(s) {
  const raw = (s / FACTOR) * (Math.pow(DESIRED_RETENTION, 1 / DECAY) - 1);
  return clamp(Math.round(raw), 1, MAX_INTERVAL);
}
// Interval preview for the rating buttons; same code path as the real schedule.
function nextInterval(card, g, missStreak) {
  return scheduleCard(card, g, missStreak).scheduled_days;
}
function formatInterval(days) {
  if (days < 1 / 1440) return '<1m';
  if (days < 1 / 24)   return Math.round(days * 1440) + 'm';
  if (days < 1)        return Math.round(days * 24) + 'h';
  if (days < 30)       return Math.round(days) + 'd';
  if (days < 365)      return Math.round(days / 30) + 'mo';
  return (days / 365).toFixed(1) + 'y';
}
// missStreak: count of consecutive reviews (including this one) where the
// hint-revealed keyword set overlapped (case-insensitive) with the previous
// review's hint-revealed set. 0 = no repeat miss. Only Recap (1.5) uses it.
function scheduleCard(card, rating, missStreak) {
  missStreak = missStreak || 0;
  const now     = new Date();
  const state   = Number(card.state) || 0;
  const lr      = card.last_review ? new Date(card.last_review) : now;
  // Elapsed in study days, capped at 2x scheduled_days (extreme overdue)
  const rawElapsed = state >= 2 ? Math.max(0, daysBetween(lr, now)) : 0;
  const schStored  = Math.max(Number(card.scheduled_days) || 1, 1);
  const elapsed    = state >= 2 ? Math.min(rawElapsed, schStored * 2) : 0;
  const s       = Math.max(Number(card.stability) || 0.1, 0.1);
  // Neutral difficulty fallback (W[4]), not rating-dependent
  const d       = clamp(Number(card.difficulty) || W[4], 1, 10);
  const r       = state >= 2 ? forgettingCurve(elapsed, s) : 1;
  // Recap (1.5) is only meaningful in Review state, where a "previous interval"
  // exists to cap against. Elsewhere it collapses to Hard (2).
  const effRating = (rating === 1.5 && state !== 2) ? 2 : rating;
  let newS;
  let newD;
  let newState;
  let schDays;
  if (state === 0) {                  // ── New ──
    newD = initD(effRating);
    newS = initS(effRating);
    if (effRating <= 2) {
      newState = 1;
      schDays = LEARNING_STEPS[0];
    } else if (effRating === 3) {
      newState = 1;
      schDays = LEARNING_STEPS[1];
    } else {
      newState = 2;
      schDays = intervalDays(newS);
    }
  } else if (state === 1) {           // ── Learning ──
    newD = nextD(d, effRating);
    newS = sShort(s, effRating);
    if (effRating === 1) {
      newState = 1;
      schDays = LEARNING_STEPS[0];    // Again → 10 min
    } else if (effRating === 2) {
      newState = 1;
      schDays = LEARNING_STEPS[1];    // Hard  → 1 h
    } else {
      newState = 2;
      schDays = intervalDays(newS);
    }
  } else if (state === 2) {           // ── Review ──
    if (rating === 1.5) {
      // Recap: difficulty as Hard; stability never grows. Repeated misses of the
      // same keywords shrink S (and so the interval) by REPEAT_MISS_DECAY per
      // consecutive miss. Interval never exceeds the previous one.
      newD = nextD(d, 2);
      const hardS = sRecall(d, s, r, 2);
      const decay = Math.pow(REPEAT_MISS_DECAY, missStreak);
      newS = Math.max(Math.min(hardS, s) * decay, 0.1);
      newState = 2;
      schDays = Math.min(intervalDays(newS), schStored);
    } else if (rating === 1) {
      newD = nextD(d, rating);
      newS = sForget(d, s, r);
      newState = 3;
      schDays = 0;
    } else {
      newD = nextD(d, rating);
      newS = Math.max(sRecall(d, s, r, rating), 0.1);
      newState = 2;
      schDays = intervalDays(newS);
    }
  } else {                            // ── Relearning ──
    newD = nextD(d, effRating);
    newS = sShort(s, effRating);
    if (effRating === 1) {
      newState = 3;
      schDays = LEARNING_STEPS[0];    // Again → 10 min
    } else if (effRating === 2) {
      newState = 3;
      schDays = LEARNING_STEPS[1];    // Hard  → 1 h
    } else {
      newState = 2;
      schDays = intervalDays(newS);
    }
  }
  const due = dueDate(now, schDays);
  return {
    stability:      +newS.toFixed(4),
    difficulty:     +newD.toFixed(4),
    elapsed_days:   elapsed,
    scheduled_days: schDays,
    reps:           (Number(card.reps)   || 0) + 1,
    lapses:         (Number(card.lapses) || 0) + (rating === 1 && state === 2 ? 1 : 0),
    state:          newState,
    last_review:    now.toISOString(),
    due:            due.toISOString()
  };
}

// shownCount=0 means no hints yet → Easy; each hint revealed lowers rating
// Ladder (each band mutually exclusive and gapless, checked strictest-first).
// No rounding on the ratio comparisons — shown/total compared directly as reals.
//   0 hints              → Easy
//   0 < h ≤ .2×total      → Good
//   .2× < h < .4×         → Hard
//   .4× ≤ h ≤ .5×         → Recap
//   h > .5×               → Again
function shownToRating(shown, total) {
  if (total <= 1) return null;
  if (shown === 0)            return 4;   // Easy
  if (shown <= total * 0.2)   return 3;   // Good
  if (shown <  total * 0.4)   return 2;   // Hard
  if (shown <= total * 0.5)   return 1.5; // Recap
  return 1;                               // Again
}
// @fsrs-end

// ═══════════════════════════════════════════════════════════════════════════
// App State
// ═══════════════════════════════════════════════════════════════════════════
let deck         = [];
let idx          = 0;
let shownCount   = 0;   // keyword hints revealed so far
let shuffledKw   = [];
let spellOpen    = false;
let sessionStats = { total: 0, again: 0, good: 0 };
let done         = 0;   // cards finished this session (re-queued cards count once)
let sessionTotal = 0;   // cards at session start
// A sub-day card (Again / lapse, 10 min step) returns after this many other
// cards; longer steps (Hard, 1 h) return at the end of the session.
const REQUEUE_GAP = 5;
// The back face is re-rendered only after the flip-back animation has hidden it,
// otherwise the next card's answer shows while the card rotates.
const FLIP_MS = 550;    // keep in sync with the .card-3d transition
let pendingBack = null;
let backTimer   = null;
let cardShownAt = 0;    // Date.now() when the current card was shown (review duration)
let homeCards   = null; // due cards prefetched by bootstrap(); consumed by startSession
let homeAt      = 0;
const HOME_CACHE_MS = 5 * 60 * 1000;
// Fields a review changes; a snapshot of them makes the last rating undoable
const FSRS_KEYS = [
  'stability', 'difficulty', 'elapsed_days', 'scheduled_days', 'reps', 'lapses',
  'state', 'last_review', 'due', 'weak_keywords', 'miss_streak'
];
let lastRating = null;   // { card, prev, rating, at, requeued, undoneTime }
const SAVE_WAIT_MS  = 8000;   // max wait for pending saves before reading from the server

// ═══════════════════════════════════════════════════════════════════════════
// Theme
// ═══════════════════════════════════════════════════════════════════════════
// localStorage can throw (blocked storage, e.g. Safari ITP in an iframe)
function storageGet(key) {
  try {
    return localStorage.getItem(key);
  } catch (e) {
    return null;
  }
}
function storageSet(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch (e) {
    // not persisted; the in-memory state still works
  }
}
function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
  storageSet('fc-theme', next);
}
function systemTheme() {
  const dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  return dark ? 'dark' : 'light';
}
function initTheme() {
  const saved = storageGet('fc-theme') || systemTheme();
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeBtn').textContent = saved === 'dark' ? '☀️' : '🌙';
}

// ═══════════════════════════════════════════════════════════════════════════
// Save queue
// Ratings are written strictly in order, one at a time, retried with backoff,
// and kept in localStorage until the server confirms them.
// ═══════════════════════════════════════════════════════════════════════════
const SAVE_KEY = 'fc-pending-saves';
const SAVE_RETRY_MAX_MS = 30000;
let saveRetryBaseMs = 2000;
let saveQueue    = [];
let saveBusy     = false;
let saveFailures = 0;
let saveTimer    = null;
let idleWaiters  = [];

function loadPendingSaves() {
  try {
    const parsed = JSON.parse(storageGet(SAVE_KEY) || '[]');
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}
function persistSaves() {
  storageSet(SAVE_KEY, JSON.stringify(saveQueue));
}
function renderSaveStatus() {
  const el = document.getElementById('save-status');
  const n  = saveQueue.length;
  if (!n) {
    el.style.display = 'none';
    return;
  }
  el.className = 'save-status' + (saveFailures ? ' error' : '');
  el.textContent = saveFailures ? `⚠ ${n} unsaved, retrying…` : `Saving ${n}…`;
  el.style.display = 'block';
}
function enqueueSave(id, fsrs, meta) {
  saveQueue.push({ id, fsrs, meta });
  persistSaves();
  drainSaves();
}
function drainSaves() {
  if (saveBusy) {
    return;
  }
  clearTimeout(saveTimer);
  renderSaveStatus();
  if (!saveQueue.length) {
    const waiters = idleWaiters;
    idleWaiters = [];
    waiters.forEach(fn => fn());
    return;
  }
  saveBusy = true;
  const job = saveQueue[0];
  google.script.run
    .withSuccessHandler(res => {
      saveBusy = false;
      if (res && res.ok === false) {
        console.error('save rejected:', res.error);   // e.g. card deleted: do not retry forever
      }
      saveQueue.shift();
      saveFailures = 0;
      persistSaves();
      drainSaves();
    })
    .withFailureHandler(err => {
      saveBusy = false;
      saveFailures++;
      console.error('save failed:', err);
      renderSaveStatus();
      const wait = Math.min(saveRetryBaseMs * Math.pow(2, saveFailures - 1), SAVE_RETRY_MAX_MS);
      saveTimer = setTimeout(drainSaves, wait);
    })
    .updateCard(job.id, job.fsrs, job.meta);
}
// Runs fn once the queue is empty, or after timeoutMs at the latest.
function whenSaved(fn, timeoutMs) {
  if (!saveQueue.length) {
    fn();
    return;
  }
  let fired = false;
  const run = () => {
    if (!fired) {
      fired = true;
      fn();
    }
  };
  idleWaiters.push(run);
  setTimeout(run, timeoutMs);
}

// ═══════════════════════════════════════════════════════════════════════════
// Screen Management
// ═══════════════════════════════════════════════════════════════════════════
const SCREENS = ['s-loading','s-home','s-session','s-complete'];
function show(id) {
  SCREENS.forEach(s => document.getElementById(s).classList.toggle('hidden', s !== id));
}

// ═══════════════════════════════════════════════════════════════════════════
// Home
// ═══════════════════════════════════════════════════════════════════════════
function showHome() {
  show('s-loading');
  homeCards = null;
  document.getElementById('home-date').textContent =
    new Date().toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  // Read only after pending saves landed, or the stats would still count them as due
  whenSaved(fetchHome, SAVE_WAIT_MS);
}
function fetchHome() {
  google.script.run
    .withSuccessHandler(res => {
      const stats = res.stats;
      homeCards = res.cards;
      homeAt    = Date.now();
      document.getElementById('stat-due').textContent   = stats.due;
      document.getElementById('stat-new').textContent   = stats.new;
      document.getElementById('stat-total').textContent = stats.total;
      const btn = document.getElementById('startBtn');
      btn.textContent = stats.due > 0 ? `▶  Start Review (${stats.due})` : '✓  Nothing due';
      btn.disabled    = stats.due === 0;
      show('s-home');
    })
    .withFailureHandler(err => { alert('Error: ' + err.message); show('s-home'); })
    .bootstrap();
}

// ═══════════════════════════════════════════════════════════════════════════
// Session
// ═══════════════════════════════════════════════════════════════════════════
function startSession() {
  // Home already fetched the due cards in the same read as the stats
  if (homeCards && Date.now() - homeAt < HOME_CACHE_MS) {
    const cards = homeCards;
    homeCards = null;
    beginSession(cards);
    return;
  }
  show('s-loading');
  whenSaved(() => {
    google.script.run
      .withSuccessHandler(beginSession)
      .withFailureHandler(err => {
        alert('Error loading cards: ' + err.message);
        show('s-home');
      })
      .getDueCards();
  }, SAVE_WAIT_MS);
}

function beginSession(cards) {
  deck  = cards || [];
  idx   = 0;
  done  = 0;
  sessionTotal = deck.length;
  sessionStats = { total: 0, again: 0, good: 0 };
  lastRating = null;
  updateUndoState();
  if (!deck.length) { showHome(); return; }
  show('s-session');
  updateProgress();
  loadCard(0);
}

function loadCard(i) {
  const card = deck[i];
  const kws  = String(card.keywords || '').split(/[;,]/).map(k => k.trim()).filter(Boolean);

  // Title shown immediately; all keyword slots start hidden
  const titleEl = document.getElementById('card-title');
  titleEl.textContent = card.title || '';
  titleEl.style.display = card.title ? 'block' : 'none';

  shuffledKw = shuffle(kws);
  shownCount = 0;   // no hints revealed at start

  const wasFlipped = isFlipped();
  setFlipped(false);
  resetSpell();

  const stateMap = {0:'New',1:'Learning',2:'Review',3:'Relearning'};
  const clsMap   = {0:'badge-new',1:'badge-learning',2:'badge-review',3:'badge-relearn'};
  const s = Number(card.state) || 0;
  const badge = document.getElementById('state-badge');
  badge.textContent = stateMap[s] || 'New';
  badge.className   = 'state-badge ' + (clsMap[s] || 'badge-new');

  renderFront();
  updateSkipBadge();
  if (wasFlipped) {
    scheduleBack(card);   // the old answer stays on the rotating face until hidden
  } else {
    cancelBack();
    renderBack(card);
  }
  renderIntervalPreviews(card);
  clearSuggestion();
  cardShownAt = Date.now();
}

function isFlipped() {
  return document.getElementById('card3d').classList.contains('flipped');
}
// Hidden face is inert: no clicks, no tab stops, no screen-reader access.
function setFlipped(flag) {
  document.getElementById('card3d').classList.toggle('flipped', flag);
  document.getElementById('face-front').toggleAttribute('inert', flag);
  document.getElementById('face-back').toggleAttribute('inert', !flag);
}
function cancelBack() {
  clearTimeout(backTimer);
  pendingBack = null;
}
function flushBack() {
  clearTimeout(backTimer);
  if (pendingBack) {
    renderBack(pendingBack);
    pendingBack = null;
  }
}
function scheduleBack(card) {
  cancelBack();
  pendingBack = card;
  backTimer = setTimeout(flushBack, FLIP_MS);
}

// Fisher–Yates (sort(() => random - .5) is biased)
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── Front ──────────────────────────────────────────────────────────────────
function renderFront() {
  const total = shuffledKw.length;
  const area  = document.getElementById('kw-area');

  // Keep typed values across the rebuild. A hint removes one slot, so pack the
  // non-empty values into the first slots instead of shifting them by position.
  const saved = [...area.querySelectorAll('.spell-slot')]
    .map(el => el.value)
    .filter(v => v.trim() !== '');
  let nextSaved = 0;

  area.innerHTML = '';

  for (let i = 0; i < total; i++) {
    if (i < shownCount) {
      // Revealed hint: colored pill
      const pill = document.createElement('span');
      pill.className = 'kw-pill';
      pill.textContent = shuffledKw[i];
      pill.style.animationDelay = (i * 0.06) + 's';
      area.appendChild(pill);
    } else if (spellOpen) {
      // Spell mode: editable input in place of ghost
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'kw-pill spell-slot';
      inp.placeholder = '●●';
      inp.value = saved[nextSaved++] || '';
      Object.entries(SPELL_INPUT_ATTRS).forEach(([k, v]) => inp.setAttribute(k, v));
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') checkSpelling(); });
      area.appendChild(inp);
    } else {
      // Normal ghost placeholder
      const pill = document.createElement('span');
      pill.className = 'kw-pill ghost';
      pill.textContent = '●●';
      area.appendChild(pill);
    }
  }

  document.getElementById('kw-count').textContent = `${shownCount} / ${total}`;
  const remaining = total - shownCount;
  document.getElementById('btn-hint').disabled = remaining === 0;
  document.getElementById('hint-status').textContent =
    remaining > 0 ? `${remaining} hint${remaining>1?'s':''} remaining` : 'All keywords shown';
}

// ── Back ───────────────────────────────────────────────────────────────────
function renderBack(card) {
  const type    = String(card.back_type || 'text').toLowerCase().trim();
  const content = String(card.back_content || '');
  const el      = document.getElementById('back-content');
  document.getElementById('back-type-badge').textContent = type;
  if (type === 'html')     { el.innerHTML = content; }
  else if (type === 'md') {
    if (typeof marked !== 'undefined') {
      el.innerHTML = marked.parse(content);
    } else {
      // renderer not loaded (offline, blocked): show the source, keep the card usable
      const note = 'Markdown renderer not loaded; showing the source.';
      el.innerHTML = '<div class="back-note">' + note + '</div>' +
        '<div class="back-content-text">' + escHtml(content) + '</div>';
    }
  }
  else { el.innerHTML = '<div class="back-content-text">' + escHtml(content) + '</div>'; }
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Interval preview badges ────────────────────────────────────────────────
// Normalised keyword key for exact-overlap comparison across reviews.
function kwKey(k) {
  return k.normalize('NFC').trim().toLowerCase();
}
// Consecutive reviews whose hint-revealed keywords overlap the previous review's.
function streakFor(card, missed) {
  const prev = new Set(String(card.weak_keywords || '').split(';').map(kwKey));
  const overlap = missed.some(k => prev.has(kwKey(k)));
  return overlap ? (Number(card.miss_streak) || 0) + 1 : 0;
}
// Reflects the hints revealed so far, so the Recap preview is exact.
function renderIntervalPreviews(card) {
  const streak = streakFor(card, shuffledKw.slice(0, shownCount));
  [1, 2, 1.5, 3, 4].forEach(g => {
    const days = nextInterval(card, g, streak);
    document.getElementById('int-' + g).textContent = formatInterval(days);
  });
}

// ── Controls ───────────────────────────────────────────────────────────────
function revealHint() {
  if (shownCount >= shuffledKw.length) return;

  // Collect non-empty typed values from spell slots
  const typedInputs = [...document.querySelectorAll('.spell-slot')]
    .map(el => el.value.trim()).filter(Boolean);

  // Among still-hidden keywords, prefer one NOT close to any typed input
  const hidden = shuffledKw.slice(shownCount);
  const pick = hidden.find(kw =>
    !typedInputs.some(inp => spellScore(inp, kw) < Infinity)
  ) || hidden[0];

  // Swap chosen keyword into the next reveal position
  const pickIdx = shuffledKw.indexOf(pick, shownCount);
  if (pickIdx > shownCount) {
    [shuffledKw[shownCount], shuffledKw[pickIdx]] =
    [shuffledKw[pickIdx], shuffledKw[shownCount]];
  }
  shownCount++;
  renderFront();
  if (spellOpen) {
    clearSpellResult();
    focusSpell();
  }
}

function flipCard() {
  const flip = !isFlipped();
  if (flip) {
    flushBack();   // flipping before the deferred render fired: show the right answer
  }
  setFlipped(flip);
  if (flip) {
    applySuggestion();
    renderIntervalPreviews(deck[idx]);
  } else {
    clearSuggestion();
  }
}
function unflipCard() {
  setFlipped(false);
}

function skipCard() {
  if (deck.length - idx <= 1) {
    return;   // nothing else pending to skip to
  }
  deck[idx]._skipped = true;
  const [card] = deck.splice(idx, 1);
  deck.push(card);
  updateProgress();
  updateSkipBadge();
  loadCard(idx);
}
function updateSkipBadge() {
  const total = deck.slice(idx).filter(c => c._skipped).length;
  const badge = document.getElementById('skip-count');
  badge.style.display = total > 0 ? 'inline-flex' : 'none';
  badge.textContent = total;
  document.getElementById('btn-skip').disabled = deck.length - idx <= 1;
}
function clearSuggestion() {
  document.querySelectorAll('.btn-rate').forEach(b => b.classList.remove('suggested'));
  document.getElementById('rating-hint').textContent = '';
}
function applySuggestion() {
  clearSuggestion();
  const suggested = shownToRating(shownCount, shuffledKw.length);
  if (!suggested) return;
  const map    = {1:'.btn-again',2:'.btn-hard',1.5:'.btn-recap',3:'.btn-good',4:'.btn-easy'};
  const labels = {1:'Again',2:'Hard',1.5:'Recap',3:'Good',4:'Easy'};
  document.querySelector(map[suggested])?.classList.add('suggested');
  document.getElementById('rating-hint').textContent =
    `Suggested: ${labels[suggested]} — ${shownCount} of ${shuffledKw.length} keywords shown`;
}

// Sub-day cards come back in this session: 10 min step after REQUEUE_GAP other
// cards, longer steps at the end. Returns true when the card was re-queued.
function requeue(card) {
  const days = Number(card.scheduled_days);
  if (days >= 1) {
    return false;
  }
  let at = deck.length;
  if (days <= LEARNING_STEPS[0]) {
    at = idx + 1 + Math.min(REQUEUE_GAP, deck.length - idx - 1);
  }
  deck.splice(at, 0, card);
  return true;
}

function rate(rating) {
  if (!isFlipped()) {
    return;   // ignore taps during the flip-back (double tap would rate the next card)
  }
  const card = deck[idx];

  // Keywords the user needed a hint for THIS review, at the moment of rating
  const missed     = shuffledKw.slice(0, shownCount);
  const missStreak = streakFor(card, missed);

  const stateBefore = Number(card.state) || 0;
  const prev = {};
  FSRS_KEYS.forEach(k => {
    prev[k] = (k in card) ? card[k] : '';
  });
  const fsrs = scheduleCard(card, rating, missStreak);
  fsrs.weak_keywords = missed.join(';');
  fsrs.miss_streak   = missStreak;

  Object.assign(card, fsrs);
  delete card._skipped;
  enqueueSave(card.id, fsrs, {
    rating:       rating,
    state_before: stateBefore,
    hints:        shownCount,
    keywords:     shuffledKw.length,
    duration_ms:  Math.min(Date.now() - cardShownAt, 1800000)
  });
  sessionStats.total++;
  if (rating === 1) {
    sessionStats.again++;
  } else {
    sessionStats.good++;
  }
  const requeued = requeue(card);
  if (!requeued) {
    done++;
  }
  lastRating = { card, prev, rating, at: idx, requeued, undoneTime: fsrs.last_review };
  updateUndoState();
  idx++;
  if (idx >= deck.length) {
    document.getElementById('cs-total').textContent = sessionStats.total;
    document.getElementById('cs-again').textContent = sessionStats.again;
    document.getElementById('cs-good').textContent  = sessionStats.good;
    show('s-complete');
  } else {
    updateProgress();
    loadCard(idx);
    updateSkipBadge();
  }
}

// ── Undo ───────────────────────────────────────────────────────────────────
function updateUndoState() {
  const can = !!lastRating;
  document.getElementById('btn-undo').disabled = !can;
  document.getElementById('btn-undo-done').classList.toggle('hidden', !can);
}

// Reverts the last rating: card fields, session counters, queue position, and
// (through the save queue, so after the original save) the sheet and the log.
function undoRating() {
  const u = lastRating;
  if (!u) {
    return;
  }
  lastRating = null;
  Object.assign(u.card, u.prev);
  delete u.card._skipped;
  sessionStats.total--;
  if (u.rating === 1) {
    sessionStats.again--;
  } else {
    sessionStats.good--;
  }
  if (u.requeued) {
    const copy = deck.indexOf(u.card, u.at + 1);
    if (copy >= 0) {
      deck.splice(copy, 1);
    }
  } else {
    done--;
  }
  idx = u.at;
  enqueueSave(u.card.id, u.prev, { undo: true, undone_time: u.undoneTime });
  show('s-session');
  updateProgress();
  loadCard(idx);
  updateUndoState();
}

// ── Keyboard ───────────────────────────────────────────────────────────────
const RATING_KEYS = new Map([['1', 1], ['2', 1.5], ['3', 2], ['4', 3], ['5', 4]]);

function isShown(id) {
  return !document.getElementById(id).classList.contains('hidden');
}

function sessionKey(key, mod, onButton) {
  if (key === 'z' || (key === 'u' && !mod)) {
    undoRating();
    return true;
  }
  if (mod) {
    return false;
  }
  if (isFlipped()) {
    if (RATING_KEYS.has(key)) {
      rate(RATING_KEYS.get(key));
      return true;
    }
    if (key === 'Enter' && !onButton) {
      const suggested = document.querySelector('.btn-rate.suggested');
      if (suggested) {
        suggested.click();
      }
      return true;
    }
    if (key === 'Escape' || key === 'Backspace') {
      unflipCard();
      return true;
    }
    return false;
  }
  if ((key === ' ' || key === 'Enter') && !onButton) {
    flipCard();
    return true;
  }
  if (key === 'h') {
    if (!document.getElementById('btn-hint').disabled) {
      revealHint();
    }
    return true;
  }
  if (key === 's') {
    toggleSpell();
    return true;
  }
  if (key === 'k') {
    if (!document.getElementById('btn-skip').disabled) {
      skipCard();
    }
    return true;
  }
  return false;
}

function onKeyDown(e) {
  const el = e.target;
  if (e.defaultPrevented || e.altKey) {
    return;
  }
  if (el.matches && el.matches('input, textarea, select, [contenteditable]')) {
    return;
  }
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (isShown('docs-modal')) {
    if (key === 'Escape') {
      closeDocs();
      e.preventDefault();
    }
    return;
  }
  const mod = e.ctrlKey || e.metaKey;
  // Space/Enter on a focused button keep their native meaning (click)
  const onButton = !!(el.closest && el.closest('button, a'));
  let handled = false;
  if (isShown('s-session')) {
    handled = sessionKey(key, mod, onButton);
  } else if (isShown('s-complete')) {
    if (key === 'Enter' && !onButton) {
      showHome();
      handled = true;
    } else if (key === 'z') {
      undoRating();
      handled = true;
    }
  } else if (isShown('s-home')) {
    const start = document.getElementById('startBtn');
    if (key === 'Enter' && !onButton && !start.disabled) {
      startSession();
      handled = true;
    }
  }
  if (handled) {
    e.preventDefault();
  }
}
document.addEventListener('keydown', onKeyDown);
// After a mouse or touch click, focus leaves the button so Space/Enter act on
// the card instead of re-triggering it (keyboard clicks have detail 0).
document.addEventListener('click', e => {
  const button = e.target.closest && e.target.closest('button');
  if (button && e.detail > 0) {
    button.blur();
  }
});

// ── Spell check ────────────────────────────────────────────────────────────
// @spell-begin
// Comparison key: NFC, case-folded, single spaces.
function spellKey(s) {
  return s.normalize('NFC').toLowerCase().trim().replace(/\s+/g, ' ');
}
// Allowed edits scale with the keyword length. CJK keywords must match exactly:
// a wrong ideograph is a different word, not a typo.
function spellThreshold(word) {
  if (/[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af\uf900-\ufaff]/.test(word)) {
    return 0;
  }
  const n = Array.from(word).length;
  if (n <= 3) {
    return 0;
  }
  return n <= 7 ? 1 : 2;
}
// Levenshtein on code points (not UTF-16 units): distance(a, b) <= threshold
function levenClose(a, b, threshold) {
  const x = Array.from(a);
  const y = Array.from(b);
  if (Math.abs(x.length - y.length) > threshold) {
    return false;
  }
  const dp = Array.from({ length: y.length + 1 }, (_, i) => i);
  for (let i = 1; i <= x.length; i++) {
    let prev = i;
    for (let j = 1; j <= y.length; j++) {
      const same = x[i - 1] === y[j - 1];
      const cost = same ? dp[j - 1] : 1 + Math.min(dp[j - 1], dp[j], prev);
      dp[j - 1] = prev;
      prev = cost;
    }
    dp[y.length] = prev;
  }
  return dp[y.length] <= threshold;
}
// 0 = exact, 1 = close enough, Infinity = no match
function spellScore(typed, target) {
  const a = spellKey(typed);
  const b = spellKey(target);
  if (a === b) {
    return 0;
  }
  return levenClose(a, b, spellThreshold(b)) ? 1 : Infinity;
}
// @spell-end
// Stop the keyboard from "fixing" the very spelling being tested.
const SPELL_INPUT_ATTRS = {
  autocapitalize: 'off',
  autocomplete: 'off',
  autocorrect: 'off',
  spellcheck: 'false',
  enterkeyhint: 'done'
};

function focusSpell() {
  const slots = [...document.querySelectorAll('.spell-slot')];
  const target = slots.find(el => el.value === '') || slots[0];
  if (target) {
    target.focus();
  }
}

function toggleSpell() {
  spellOpen = !spellOpen;
  document.getElementById('spell-actions').style.display = spellOpen ? 'flex' : 'none';
  if (!spellOpen) {
    document.getElementById('spell-result').textContent = '';
    document.getElementById('spell-result').style.display = 'none';
  }
  renderFront();
  if (spellOpen) {
    focusSpell();
  }
}

function resetSpell() {
  spellOpen = false;
  document.getElementById('spell-result').textContent = '';
  document.getElementById('spell-result').style.display = 'none';
  document.getElementById('spell-actions').style.display = 'none';
  // renderFront() called by loadCard immediately after
}

function clearSpellResult() {
  document.getElementById('spell-result').textContent = '';
  document.getElementById('spell-result').style.display = 'none';
}

function clearSpell() {
  document.querySelectorAll('.spell-slot').forEach(inp => {
    inp.value = '';
    inp.className = 'kw-pill spell-slot';
  });
  document.getElementById('spell-result').textContent = '';
  document.getElementById('spell-result').style.display = 'none';
}

function checkSpelling() {
  const slots  = [...document.querySelectorAll('.spell-slot')];
  const typed  = slots.map(el => el.value.trim());

  // Spell slots correspond to hidden keywords: shuffledKw[shownCount..end]
  const targets = shuffledKw.slice(shownCount);
  const used    = new Array(targets.length).fill(false);
  const matched = new Array(slots.length).fill(null);

  const scores = typed.map(t => targets.map(kw => spellScore(t, kw)));
  // Process best-scoring inputs first (exact matches take priority)
  const order = typed.map((_, i) => i).sort((a, b) =>
    Math.min(...scores[a]) - Math.min(...scores[b])
  );
  for (const i of order) {
    let bestJ = -1, bestScore = Infinity;
    for (let j = 0; j < targets.length; j++) {
      if (!used[j] && scores[i][j] < bestScore) { bestScore = scores[i][j]; bestJ = j; }
    }
    if (bestJ >= 0 && bestScore < Infinity) { matched[i] = bestJ; used[bestJ] = true; }
  }

  let correct = 0;
  slots.forEach((inp, i) => {
    if (typed[i] === '') { inp.className = 'kw-pill spell-slot'; return; }
    if (matched[i] !== null) { inp.className = 'kw-pill spell-slot correct'; correct++; }
    else                     { inp.className = 'kw-pill spell-slot wrong'; }
  });

  const filled   = typed.filter(t => t !== '').length;
  const total    = targets.length;
  const resultEl = document.getElementById('spell-result');
  if (filled === 0) {
    resultEl.textContent = '';
    resultEl.style.display = 'none';
  } else {
    resultEl.textContent = correct === total
      ? `✓ All ${total} correct!`
      : `${correct} / ${filled} matched (${total - filled} keywords remaining)`;
    resultEl.style.display = 'block';
  }
}

// ── Progress ───────────────────────────────────────────────────────────────
function updateProgress() {
  const total = sessionTotal;
  const pct   = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('prog-text').textContent = `${done} / ${total}`;
  document.getElementById('prog-pct').textContent  = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-bar').setAttribute('aria-valuenow', pct);
}

// ═══════════════════════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════════════════════
initTheme();
saveQueue = loadPendingSaves();   // ratings not confirmed before the last close
window.addEventListener('beforeunload', e => {
  if (saveQueue.length) {
    e.preventDefault();
    e.returnValue = '';
  }
});
drainSaves();
showHome();
</script>
