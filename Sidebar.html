<script>
// First thing on the page, before the libraries load: everything that goes wrong is kept
// here and shown in red (#problems) once the page exists: a script that did not load
// (blocked, offline, wrong hash), a policy violation, an uncaught error.
var flashProblems = [];
function flashShow() {
  var box = document.getElementById('problems');
  if (box && flashProblems.length) {
    box.hidden = false;
    box.textContent = flashProblems.join('\n');
  }
}
function flashFail(text) {
  if (flashProblems.indexOf(text) < 0) {
    flashProblems.push(text);
  }
  flashShow();
}
window.addEventListener('error', function (e) {
  if (e.target && e.target !== window) {          // a resource: only scripts matter here
    if (e.target.tagName === 'SCRIPT') {
      flashFail('Could not load ' + e.target.src + ' (blocked, offline or wrong hash)');
    }
    return;
  }
  flashFail('Script error: ' + (e.message || 'unknown') + (e.lineno ? ' (line ' + e.lineno + ')' : ''));
}, true);
window.addEventListener('unhandledrejection', function (e) {
  flashFail('Script error: ' + ((e.reason && e.reason.message) || e.reason));
});
document.addEventListener('securitypolicyviolation', function (e) {
  flashFail('Blocked by the page policy (' + e.effectiveDirective + '): ' + e.blockedURI);
});
</script>

<!-- The card sits in a shadow root of this page, not in a nested frame: it needs no
     layout of its own and works where Apps Script does not let a nested frame show. -->

<script>
// @sync-render-begin
// Card content -> HTML that is safe to inject. Types: text, md, html, svg; any
// other type is shown as text. Needs marked (md) and DOMPurify (md, html, svg).
// Without them the source is shown as text, so a card stays usable and nothing
// unsanitized is ever injected. Kept apart so the sheet preview can reuse it.
// An html or svg card with its own <style> block is mounted in a shadow root (see
// mountBack): its CSS is scoped to the card and can not restyle the app.
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// Scripts, event handlers, javascript: links, iframes, object/embed, meta, forms
// and style blocks are removed; the style attribute, tables, details, media, data:
// images and inline SVG stay. Links open in a new tab, outside this frame.
const SANITIZE = {
  USE_PROFILES: { html: true, svg: true, svgFilters: true },
  FORBID_TAGS: ['style', 'form'],
  FORBID_ATTR: ['action', 'formaction']
};
if (typeof DOMPurify !== 'undefined' && DOMPurify.isSupported) {
  DOMPurify.addHook('afterSanitizeAttributes', node => {
    if (node.nodeName.toLowerCase() === 'a' &&
        (node.hasAttribute('href') || node.hasAttribute('xlink:href'))) {
      node.setAttribute('target', '_blank');
      node.setAttribute('rel', 'noopener noreferrer');
    }
  });
}
function escAttr(s) {
  return escHtml(s).replace(/"/g, '&quot;');
}
// back_type "live": a card with scripts, styles or iframes. It runs in a frame of its
// own, never in the app. The sandbox has no allow-same-origin, so the card gets an
// opaque origin: no google.script.run, storage or cookies of the app. The CSP keeps
// the card from fetch, XHR, WebSocket and form posts; https images, scripts, styles,
// media, fonts and frames (YouTube, a CDN library) are allowed. Links open in a tab.
const LIVE_SANDBOX = 'allow-scripts allow-popups allow-popups-to-escape-sandbox';
const LIVE_CSP = "default-src 'none'; script-src 'unsafe-inline' https:; " +
  "style-src 'unsafe-inline' https:; img-src https: data: blob:; media-src https: data: blob:; " +
  "font-src https: data:; frame-src https:; connect-src 'none'; form-action 'none'; " +
  "base-uri 'none'";
// Placed before the card's own markup, so the card can not break it. It reports the
// height of the content to the app, which sizes the frame (see onLiveMessage).
const LIVE_REPORTER = '(function () {' +
  'var last = 0;' +
  'function send() {' +
  'var b = document.body; if (!b) return;' +
  'var h = Math.ceil(Math.max(b.scrollHeight, b.offsetHeight));' +
  'if (h !== last) { last = h; parent.postMessage({ fcLive: true, h: h }, "*"); }' +
  '}' +
  'addEventListener("load", send); document.addEventListener("DOMContentLoaded", send);' +
  'if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);' +
  '})();';

  return '<!DOCTYPE html><html><head><meta charset="utf-8">' +
    '<meta http-equiv="Content-Security-Policy" content="' + LIVE_CSP + '">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<style>html, body { margin: 0; } body { padding: 12px; box-sizing: border-box;' +
    ' font: 15px/1.5 system-ui, sans-serif; color: #1d1d1f; background: #fff; }</style>' +
    '<script>' + LIVE_REPORTER + '<' + '/script></head><body>' + content + '</body></html>';
}
// Selectors of a stylesheet moved into a shadow root: html, body and :root there
// mean the card's own root element. Only rule preludes are touched, never values.
function scopeCss(css, root) {
  return css.replace(/([^{}]+)\{/g, (all, prelude) => prelude
    .replace(/(^|[\s,>+~(])(?:html|:root)\s*>?\s*body(?![\w-])/gi, (m, pre) => pre + root)

// An html or svg card that brings <style> rules needs a scope of its own.
function isStyledCard(content, type) {
  return (type === 'html' || type === 'svg') && /<style[\s>]/i.test(content);
}

  ' color: #1d1d1f; font: 15px/1.5 system-ui, sans-serif; overflow-wrap: anywhere; }' +
  ' .fc-root img, .fc-root svg { max-width: 100%; }';

function styledMarkup(content) {
  if (typeof DOMPurify === 'undefined' || !DOMPurify.isSupported) {
    return '';
  }
  const clean = DOMPurify.sanitize(content, {
    ...SANITIZE, FORBID_TAGS: ['form'], FORCE_BODY: true

  const scoped = clean.replace(/(<style\b[^>]*>)([\s\S]*?)(<\/style>)/gi,

// An <img> that does not load is a blank box. Say so under it, with the usual cause: a
// Drive file that is not shared with "Anyone with the link" (the request goes from the
// browser, so it can not use your sign-in). "error" does not bubble, hence a capturing
// listener on the card's root; once per root, once per image.
function noteBrokenImages(root) {
  if (root.fcWatched) {
    return;
  }
  root.fcWatched = true;
  root.addEventListener('error', e => {
    const img = e.target;
    if (!img || img.nodeName !== 'IMG' || img.dataset.noted) {
      return;
    }
    img.dataset.noted = '1';
    const src = img.getAttribute('src') || '';
    const note = img.ownerDocument.createElement('div');
    note.className = 'back-note';
    note.setAttribute('style', 'margin:4px 0;font:12px/1.4 system-ui,sans-serif;color:#b42318');
    note.textContent = 'Image did not load: ' +
      (/^data:/i.test(src) ? 'a data: address' : src.replace(/^https?:\/\//i, '').slice(0, 100)) +
      (/^https:\/\/(drive|docs)\.google\.com\//i.test(src)
        ? ' (a Drive file must be shared with "Anyone with the link"; open the address in a ' +
          'private window to check)'

// Puts a card into `el`. Everything but a styled card is plain renderHtml markup.
function mountBack(el, content, type) {

    noteBrokenImages(el);
    el.innerHTML = renderHtml(content, type);
    return;
  }
  const host = el.ownerDocument.createElement('div');
  host.className = 'fc-styled';
  const shadow = host.attachShadow({ mode: 'open' });
  noteBrokenImages(shadow);
  shadow.innerHTML = markup;
  el.replaceChildren(host);

function renderHtml(content, type) {
  if (type === 'live') {
    return '<iframe class="live-frame" title="Card content" sandbox="' + LIVE_SANDBOX +
      '" srcdoc="' + escAttr(liveDocument(content)) + '"></iframe>';
  }
  const asText = note => (note ? '<div class="back-note">' + note + '</div>' : '') +
    '<div class="back-content-text">' + escHtml(content) + '</div>';
  if (type !== 'md' && type !== 'html' && type !== 'svg') {
    return asText('');
  }
  if (typeof DOMPurify === 'undefined' || !DOMPurify.isSupported) {
    return asText('Sanitizer not loaded; showing the source.');
  }
  if (type === 'md') {
    if (typeof marked === 'undefined') {
      return asText('Markdown renderer not loaded; showing the source.');
    }
    return DOMPurify.sanitize(marked.parse(content), SANITIZE);
  }
  return DOMPurify.sanitize(content, SANITIZE);
}
// @sync-render-end
</script>

// @sync-css-end
// The app's own stylesheet, scoped to the card: html, body and :root become .fc-page.
const PAGE_CSS = scopeCss(APP_CSS, '.fc-page') +
  '.fc-page{display:block;height:auto;min-height:0;overflow:visible;padding:12px;' +
  'background:#fff}.fc-page::before,.fc-page::after{display:none}';
let liveWaitMs = 3000;
const cardHost = document.getElementById('card');
const cardRoot = cardHost.attachShadow ? cardHost.attachShadow({ mode: 'open' }) : null;
const liveBox = document.getElementById('live');
const diag = document.getElementById('diag');
let lastKey = '';
// What the status line reports: is the script alive, is the sheet answering, and what.
let polls = 0;
let answers = 0;
let lastDesc = 'nothing yet';
let serverVersion = '';

// The libraries decide whether md, html and svg cards are drawn or shown as source.
function libState() {
  const purify = typeof DOMPurify === 'undefined' ? 'DOMPurify NOT LOADED'
    : !DOMPurify.isSupported ? 'DOMPurify UNSUPPORTED here'
    : 'DOMPurify ' + (DOMPurify.version || 'ok');
  const md = typeof marked === 'undefined' ? 'marked NOT LOADED' : 'marked ok';
  return { purify, md, ok: !/NOT|UNSUPPORTED/.test(purify + md) };
}

function showStatus() {
  const libs = libState();
  document.getElementById('status').textContent = 'polls ' + polls + ' · answers ' + answers +
    ' · last: ' + lastDesc + (serverVersion ? ' · script v' + serverVersion : '') +
    ' · ' + libs.purify + ' · ' + libs.md;
}

// A card whose type is text (or blank) but whose content looks like html, svg or md is
// shown as source: say why, and what to set.
function showHint(res) {
  const hint = document.getElementById('hint');
  const looks = res.sniffed;
  const mismatch = res.type === 'text' && looks && looks !== 'text';
  hint.hidden = !mismatch;
  hint.textContent = mismatch
    ? 'back_type is "text" (or blank), so the source is shown. The content looks like ' +
      looks + ': set back_type to ' + looks + '.'
    : '';
}

function showNote(text) {
  const note = document.getElementById('note');
  note.textContent = text;
  note.hidden = false;
  cardHost.hidden = true;
  liveBox.hidden = true;
  liveBox.textContent = '';
  document.getElementById('meta').textContent = '';
}

// Same markup as the app's #back-content, in a shadow root: the app CSS can not
// leak into this page and this page's CSS can not reach the card.
function showCard(res) {
  liveBox.hidden = true;
  liveBox.textContent = '';
  cardHost.hidden = false;
  cardRoot.innerHTML = '<style>' + PAGE_CSS + '</style><div class="fc-page">' +
    '<div class="back-content" id="back-content"></div></div>';
  mountBack(cardRoot.querySelector('#back-content'), res.content, res.type);
}

// A live card runs (isolated, see liveDocument) in a nested frame. If that frame never
// reports back, Apps Script or the browser blocked it (or its scripts): say so.
function showLive(res) {
  cardHost.hidden = true;
  liveBox.hidden = false;
  const frame = document.createElement('iframe');
  frame.className = 'live-frame';
  frame.title = 'Card content';
  frame.setAttribute('sandbox', LIVE_SANDBOX);
  frame.srcdoc = liveDocument(res.content);
  liveBox.textContent = '';
  liveBox.appendChild(frame);
  setTimeout(() => {
    if (frame.isConnected && !frame.dataset.ready) {
      diag.hidden = false;
      diag.textContent = 'This live card did not start: the nested frame, its scripts ' +
        'or postMessage may be blocked here.';
    }
  }, liveWaitMs);
}

window.addEventListener('message', e => {
  const d = e.data;
  const frame = liveBox.querySelector('iframe');
  if (frame && d && d.fcLive === true && typeof d.h === 'number' && isFinite(d.h) &&
      frame.contentWindow === e.source) {
    frame.dataset.ready = '1';
    diag.hidden = true;
    diag.textContent = '';
    frame.style.height = Math.min(Math.max(Math.ceil(d.h), 40), 4000) + 'px';
  }
});

function show(res) {
  answers += 1;
  serverVersion = res.version || serverVersion;
  lastDesc = res.error ? 'error' : res.note ? 'note' : 'row ' + res.row + ' ' + res.type;
  showStatus();
  if (res.note) {
    showNote(res.note);
    document.getElementById('hint').hidden = true;
    lastKey = '';
    return;
  }
  const key = [res.row, res.type, res.content].join('\u0001');
  if (key === lastKey) return;
  lastKey = key;
  document.getElementById('note').hidden = true;
  diag.hidden = true;
  diag.textContent = '';
  document.getElementById('meta').textContent = 'row ' + res.row + ' · ' + res.id + ' · ' + res.type;
  showHint(res);
  try {
    if (res.type === 'live') {
      showLive(res);
    } else if (cardRoot) {
      showCard(res);
    } else {
      throw new Error('this browser has no shadow DOM');
    }
  } catch (err) {
    showNote('Preview failed: ' + err.message);   // the meta line is cleared; the row is not
  }
}

function poll() {
  if (document.hidden) return;
  polls += 1;
  showStatus();
  google.script.run
    .withSuccessHandler(show)
    .withFailureHandler(err => show({ note: 'Error: ' + err.message, error: true }))
    .getActiveRowPreview();
}

// Show what went wrong before this script ran (a library that did not load, ...), and
// say outright when md, html and svg can not be drawn.
{
  const libs = libState();
  if (!libs.ok) {
    flashFail('Cards of type md, html and svg are shown as source text: ' + libs.purify +
      ', ' + libs.md + '.');
  }
}
flashShow();                                      // what failed before this script ran
setInterval(poll, 1500);
poll();
</script>
